services:
  engine:
    image: ${IMAGE}
    ports: ["${PORT}:30000"]
    shm_size: 2gb
    environment: {HF_HOME: /cache/hf}
    command: >-
      python3 -m sglang.launch_server --host 0.0.0.0 --port 30000 --device cpu
      --model-path Qwen/Qwen2.5-0.5B-Instruct --served-model-name qwen2.5-0.5b
      --max-running-requests 2 --enable-metrics
    volumes: [models:/cache]
volumes:
  models: {name: pharos-models, external: true} # created by capture.sh, shared by all engines
