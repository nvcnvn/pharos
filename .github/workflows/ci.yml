# Every PR: layers 1–3, plus layer 4 for the tier-1 engines at their pinned versions
# (livePinned in internal/engine/live_test.go). ARCHITECTURE §14, CI cadence.
name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - run: go vet ./... && go vet -tags integration ./...
      - run: go test ./...

  live:
    strategy:
      fail-fast: false
      matrix:
        engine: [ollama, llamacpp, vllm]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - run: go test -tags integration -timeout 50m -v -run TestLive ./internal/engine
        env:
          PHAROS_LIVE_ENGINES: ${{ matrix.engine }}
