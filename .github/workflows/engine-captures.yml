# Nightly (and on harness changes): layer 4 against each engine's latest release. A failure
# means the engine drifted; the capture artifact holds the new bodies to diff against testdata/.
# Backfill: a PR that changes test/engines/candidates.json captures every version listed there
# (or dispatch with a versions list). The report job compares consecutive versions in the run
# summary (test/engines/report.sh).
name: engine-captures

on:
  workflow_dispatch:
    inputs:
      versions:
        description: 'JSON list of {"engine", "version"}; empty = every engine at its latest release'
        required: false
  pull_request:
    paths: [test/engines/candidates.json]
  push: # a harness change must still bring every engine up
    branches: [main]
    paths: [test/engines/**, cmd/pharos/**, internal/engine/**, .github/workflows/engine-captures.yml]
  schedule:
    - cron: "0 3 * * *"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs: {matrix: "${{ steps.m.outputs.matrix }}"}
    steps:
      - uses: actions/checkout@v7
      - id: m # sglang: Xeon CPU image, amd64 only. mlx-lm: Apple Silicon only, runs without docker
        env: {VERSIONS: "${{ inputs.versions }}", EVENT: "${{ github.event_name }}"}
        run: |
          if [ -n "$VERSIONS" ]; then m=$(jq -c . <<<"$VERSIONS")
          elif [ "$EVENT" = pull_request ]; then m=$(jq -c . test/engines/candidates.json)
          else m='[{"engine":"ollama"},{"engine":"llamacpp"},{"engine":"llama-swap"},{"engine":"vllm"},{"engine":"sglang"},{"engine":"mlx-lm","os":"macos-latest"}]'
          fi
          echo "matrix=$m" >>"$GITHUB_OUTPUT"

  live:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 75 # 40 is plenty without SDE
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - if: matrix.engine == 'mlx-lm'
        uses: astral-sh/setup-uv@v10.2.0
      # AVX-512 varies by runner and can't be requested. Without it some vLLM and SGLang CPU images
      # exit with SIGILL, so there the engine runs under Intel SDE (test/engines/<engine>/sde.compose.yaml).
      - id: cpu
        run: grep -qs avx512f /proc/cpuinfo && echo avx512=true >>"$GITHUB_OUTPUT" || echo avx512=false >>"$GITHUB_OUTPUT"
      - if: steps.cpu.outputs.avx512 == 'false' && (matrix.engine == 'vllm' || matrix.engine == 'sglang')
        uses: petarpetrovt/setup-sde@6d2773bc0ef3005fd52e0ae0bb91782321793aec # v6.0, SDE 10.13.1; using it accepts Intel's SDE license
      - run: rm -rf internal/engine/testdata/${{ matrix.engine }} # the artifact holds only this run's capture
      - run: |
          set -o pipefail
          go test -tags integration -timeout 70m -v -run TestLive ./internal/engine 2>&1 | tee "$RUNNER_TEMP/test.log"
        env:
          PHAROS_LIVE_ENGINES: ${{ matrix.engine }}
          PHAROS_LIVE_VERSION: ${{ matrix.version || 'latest' }}
          PHAROS_RECORD: "1" # keep the capture in testdata/ for the artifact
          GH_TOKEN: ${{ github.token }} # latest-release lookup
      - if: always()
        run: | # test.log and the runner's CPU go next to the capture they belong to
          d=$(ls -d internal/engine/testdata/${{ matrix.engine }}/*/ 2>/dev/null | head -1)
          d=${d:-internal/engine/testdata/${{ matrix.engine }}/${{ matrix.version || 'unknown' }}/}
          mkdir -p "$d" && cp "$RUNNER_TEMP/test.log" "$d" || true
          { grep -m1 'model name' /proc/cpuinfo; grep -oE 'avx512[a-z_]*|amx[a-z_]*' /proc/cpuinfo | sort -u | tr '\n' ' '; [ -n "${SDE_PATH:-}" ] && echo "under Intel SDE"; } >"$d/cpu.txt" 2>/dev/null || true
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capture-${{ matrix.engine }}-${{ matrix.version || 'latest' }}
          path: internal/engine/testdata/${{ matrix.engine }}

  report:
    needs: live
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: {pattern: capture-*, path: artifacts}
      - run: | # artifacts/capture-<engine>-<version>/<version>/ → captures/<engine>/<version>/
          for a in artifacts/capture-*/; do n=$(basename "$a"); n=${n#capture-}; e=${n%-*}
            mkdir -p "captures/$e" && cp -R "$a"* "captures/$e/"; done
          test/engines/report.sh captures >"$GITHUB_STEP_SUMMARY"
          cp "$GITHUB_STEP_SUMMARY" report.md
      - uses: actions/upload-artifact@v7
        with: {name: report, path: report.md}
