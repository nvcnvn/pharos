# Spike stage: run test/engines/capture.sh for every engine and keep the raw captures as artifacts.
# Nightly and on harness changes = each engine's latest release. Pinned versions and PR runs come with the layer-4 Go tests.
name: engine-captures

on:
  workflow_dispatch:
  push: # a harness change must still bring every engine up
    branches: [main]
    paths: [test/engines/**, .github/workflows/engine-captures.yml]
  schedule:
    - cron: "0 3 * * *"

jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: ollama
          - engine: llamacpp
          - engine: llama-swap
          - engine: vllm
          - engine: sglang # Xeon CPU image, amd64 only
          - engine: mlx-lm # Apple Silicon only, runs without docker
            os: macos-latest
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - if: matrix.engine == 'mlx-lm'
        uses: astral-sh/setup-uv@v10.2.0
      - if: matrix.engine == 'sglang' # the Xeon image may need AVX-512/AMX
        run: grep -oE 'avx512[a-z_]*|amx[a-z_]*' /proc/cpuinfo | sort -u | tr '\n' ' '
      - run: test/engines/capture.sh ${{ matrix.engine }} ${{ matrix.version }}
        env:
          GH_TOKEN: ${{ github.token }} # latest-release lookup
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capture-${{ matrix.engine }}
          path: internal/engine/testdata/${{ matrix.engine }}
