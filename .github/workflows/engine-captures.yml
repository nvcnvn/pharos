# Nightly (and on harness changes): layer 4 against each engine's latest release. A failure
# means the engine drifted; the capture artifact holds the new bodies to diff against testdata/.
name: engine-captures

on:
  workflow_dispatch:
  push: # a harness change must still bring every engine up
    branches: [main]
    paths: [test/engines/**, cmd/pharos/**, internal/engine/**, .github/workflows/engine-captures.yml]
  schedule:
    - cron: "0 3 * * *"

jobs:
  live-latest:
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: ollama
          - engine: llamacpp
          - engine: llama-swap
          - engine: vllm
          - engine: sglang # Xeon CPU image, amd64 only
          - engine: mlx-lm # Apple Silicon only, runs without docker
            os: macos-latest
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: {go-version-file: go.mod}
      - if: matrix.engine == 'mlx-lm'
        uses: astral-sh/setup-uv@v10.2.0
      - if: matrix.engine == 'sglang' # the Xeon image may need AVX-512/AMX
        run: grep -oE 'avx512[a-z_]*|amx[a-z_]*' /proc/cpuinfo | sort -u | tr '\n' ' '
      - run: go test -tags integration -timeout 35m -v -run TestLive ./internal/engine
        env:
          PHAROS_LIVE_ENGINES: ${{ matrix.engine }}
          PHAROS_LIVE_VERSION: latest
          PHAROS_RECORD: "1" # keep the capture in testdata/ for the artifact
          GH_TOKEN: ${{ github.token }} # latest-release lookup
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: capture-${{ matrix.engine }}
          path: internal/engine/testdata/${{ matrix.engine }}
