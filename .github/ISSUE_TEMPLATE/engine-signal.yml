name: Engine report
description: Pharos reads a signal wrong, or not at all, on your engine version
labels: [engine]
body:
  - type: input
    id: engine
    attributes:
      label: Engine and version
      placeholder: vLLM v0.31.0 (vllm/vllm-openai:v0.31.0)
    validations: {required: true}
  - type: input
    id: hardware
    attributes:
      label: Hardware and how the engine runs
      placeholder: RTX 4090, Docker; or M2 Mac, native
  - type: textarea
    id: doctor
    attributes:
      label: pharos doctor output
      description: Run `pharos doctor -url <engine URL>` while a model is loaded and a request is running.
      render: text
    validations: {required: true}
  - type: textarea
    id: expected
    attributes:
      label: What's wrong
      description: Which signal is wrong or unknown, and what the engine really reports (the metric, field or log line, if you know it).
    validations: {required: true}
  - type: markdown
    attributes:
      value: |
        **A capture helps most.** Run `pharos doctor -url <engine URL> -record capture/` while the engine is busy, zip `capture/` and attach it here. It holds the raw responses of the engine's status endpoints. Look through them before you attach them: with `-logs` the capture also includes the engine log, which can contain prompts.
